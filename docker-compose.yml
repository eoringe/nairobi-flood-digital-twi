# =============================================================================
#  Nairobi Flood Digital Twin - local Docker Compose stack
#
#  docker compose up --build      build the image and start the dashboard
#  docker compose logs -f         follow the server log
#  docker compose down            stop (scenario history is kept in the volume)
#
#  Open http://localhost:8050 once the container reports "healthy"
#  (docker compose ps), about a minute after start.
# =============================================================================

services:
  dashboard:
    build: .
    image: nairobi-flood-twin:latest
    container_name: nairobi-flood-twin
    ports:
      - "8050:8050"
    volumes:
      # Scenario history, accounts and audit log (SQLite), the session key and
      # the last live forecast, kept across restarts and rebuilds.
      - twin-state:/app/state
    # Accounts and Google sign-in. Values come from a .env file beside this
    # one (see .env.example); all are optional.
    environment:
      - TWIN_SECRET_KEY
      - TWIN_ADMIN_EMAIL
      - TWIN_ADMIN_EMAILS
      - TWIN_COOKIE_SECURE
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_APP_ID
      # Integrated Flood Monitoring System partners (docs/capstone/INTEGRATION_GUIDE.md).
      # Unset: the dashboard shows each system as "not connected".
      - IOT_API_URL
      - IOT_API_KEY
      - ALERTS_API_URL
      - ALERTS_API_KEY
      - INFRA_API_URL
      - INFRA_API_KEY
      - SUPPLY_API_URL
      - SUPPLY_API_KEY
      - BENEFICIARY_API_URL
      - BENEFICIARY_API_KEY
      # PostgreSQL for accounts, reports and history (src/persistence/backend.py).
      # Unset: SQLite files in the twin-state volume. To use the postgres service
      # below: DATABASE_URL=postgresql://twin:change-me@postgres:5432/nairobi_flood_twin
      - DATABASE_URL
      # Machine access to /api/v1: "token:role,token:role".
      - TWIN_API_TOKENS
      # 1 = labelled demo data for partner systems that are not connected.
      - INTEGRATION_DEMO
    restart: unless-stopped

  # Optional PostgreSQL for the records above: uncomment, set DATABASE_URL as
  # shown in the dashboard's environment, and `docker compose up --build`.
  # Commented out so `docker compose up` needs no credentials. (PostGIS rather
  # than plain PostgreSQL so the ERD's spatial entities can move here later.)
  # postgres:
  #   image: postgis/postgis:16-3.4
  #   environment:
  #     - POSTGRES_DB=nairobi_flood_twin
  #     - POSTGRES_USER=twin
  #     - POSTGRES_PASSWORD=change-me
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  twin-state:
  # pgdata:
