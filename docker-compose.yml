# =============================================================================
#  Nairobi Flood Digital Twin - local Docker Compose stack
#
#  docker compose up --build      build the image and start the dashboard
#  docker compose logs -f         follow the server log
#  docker compose down            stop (scenario history is kept in the volume)
#
#  Open http://localhost:8050 once the container reports "healthy"
#  (docker compose ps), about a minute after start.
# =============================================================================

services:
  dashboard:
    build: .
    image: nairobi-flood-twin:latest
    container_name: nairobi-flood-twin
    ports:
      - "8050:8050"
    volumes:
      # Scenario history, accounts and audit log (SQLite), the session key and
      # the last live forecast, kept across restarts and rebuilds.
      - twin-state:/app/state
    # Accounts and Google sign-in. Values come from a .env file beside this
    # one (see .env.example); all are optional.
    environment:
      - TWIN_SECRET_KEY
      - TWIN_ADMIN_EMAIL
      - TWIN_ADMIN_EMAILS
      - TWIN_COOKIE_SECURE
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_APP_ID
    restart: unless-stopped

  # Upgrade path for the database: swap SQLite for PostGIS once the ERD's
  # spatial entities are needed (src/persistence/database.py reads
  # DATABASE_URL). Commented out so `docker compose up` needs no credentials.
  # postgis:
  #   image: postgis/postgis:16-3.4
  #   environment:
  #     - POSTGRES_DB=nairobi_flood_twin
  #     - POSTGRES_USER=twin
  #     - POSTGRES_PASSWORD=change-me
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  twin-state:
  # pgdata:
